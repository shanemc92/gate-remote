<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gate Remote</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        :root {
            color-scheme: dark;
            --bg: #14161a;
            --card: #1e2126;
            --border: #2b2f36;
            --text: #e8e8ea;
            --muted: #9a9ea6;
            --accent: #e5484d;
            --accent-hover: #ff5c60;
            --ok: #30a46c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 1rem;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 600;
            text-align: center;
            margin: 0 0 1.5rem;
        }
        .btn {
            display: block;
            width: 100%;
            font-family: inherit;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: 10px;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.75rem;
            transition: background 0.15s ease;
        }
        .btn-toggle {
            background: var(--accent);
            color: #fff;
        }
        .btn-toggle:hover { background: var(--accent-hover); }
        .btn-scheduler {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-scheduler.on {
            background: var(--ok);
            color: #fff;
            border-color: var(--ok);
        }
        .schedules {
            margin-top: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .schedule-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.5rem 0.75rem;
        }
        .schedule-row label {
            color: var(--muted);
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .schedule-row input[type="time"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
        }
        .schedule-row input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
        }
        .camera {
            margin-bottom: 1.25rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg);
        }
        .camera img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }
        .camera .label {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0.65rem;
            font-size: 0.75rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="card">
        {% if camera_enabled %}
        <div class="camera">
            <img id="cam" src="/snapshot.jpg" alt="Gate camera">
            <div class="label">
                <span>Gate camera</span>
                <span id="cam-updated">updating…</span>
            </div>
        </div>
        {% endif %}

        <form method="post" action="/toggle">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-toggle">Toggle Gate</button>
        </form>

        <form method="post" action="/toggle-scheduler">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-scheduler {{ 'on' if scheduler_enabled else '' }}">
                Scheduler: {{ 'On' if scheduler_enabled else 'Off' }}
            </button>
        </form>

        <div class="schedules">
            {% for job, time in jobs.items() %}
            <form method="post" action="/update_job/{{ job }}" class="schedule-row">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="time-{{ job }}">Time {{ job }}</label>
                <input type="time" id="time-{{ job }}" name="new_time" value="{{ time }}" onchange="this.form.submit()">
            </form>
            {% endfor %}
        </div>
    </div>
    {% if camera_enabled %}
    <script>
        const camImg = document.getElementById("cam");
        const camLabel = document.getElementById("cam-updated");
        function refreshCam() {
            camImg.src = "/snapshot.jpg?t=" + Date.now();
            camLabel.textContent = new Date().toLocaleTimeString();
        }
        refreshCam();
        setInterval(refreshCam, {{ snapshot_interval * 1000 }});
    </script>
    {% endif %}
</body>
</html>
